services:
  - type: web
    name: zygo-ipd-lab
    runtime: python
    repo: https://github.com/shoon94parkk-del/ZYGO-IPD
    branch: main
    buildCommand: pip install .
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    autoDeployTrigger: commit
