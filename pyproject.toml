[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zygo-ipd"
version = "0.1.0"
description = "ZYGO XYZ wafer-shape to IPD analysis and visualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "plotly>=5.18",
  "streamlit>=1.37",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zygo-ipd = "zygo_ipd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
